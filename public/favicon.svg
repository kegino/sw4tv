<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Obsidian Carbon -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18100e"/>
      <stop offset="50%" stop-color="#0e0a09"/>
      <stop offset="100%" stop-color="#050303"/>
    </linearGradient>

    <!-- Molten Solar Amber Gradient -->
    <linearGradient id="amber-solar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Outer Border Gold Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="solar-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container with Golden Outline -->
  <rect width="512" height="512" rx="120" fill="url(#bg-grad)"/>
  <rect x="3" y="3" width="506" height="506" rx="117" fill="none" stroke="url(#border-grad)" stroke-width="4.5" stroke-opacity="0.5"/>

  <!-- Radial Glow Behind the Symbol -->
  <circle cx="256" cy="256" r="150" fill="#f59e0b" opacity="0.14" filter="blur(32px)"/>

  <!-- Stylized SW4TV Monogram Symbol -->
  <g id="sw4-emblem" filter="url(#solar-bloom)">
    <!-- Aerodynamic Chevron Wing Left (Representing S & W) -->
    <path d="M 120 180 L 190 180 L 256 310 L 210 390 L 120 220 Z" fill="url(#amber-solar)"/>

    <!-- Aerodynamic Chevron Wing Right -->
    <path d="M 392 180 L 322 180 L 256 310 L 302 390 L 392 220 Z" fill="url(#amber-solar)"/>

    <!-- Central Diamond / Number 4 Peak & Play Core -->
    <polygon points="256,120 306,220 256,260 206,220" fill="url(#amber-solar)"/>

    <!-- Central Play Arrow Core in Bright Gold/White -->
    <polygon points="242,228 276,248 242,268" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- High-Tech Accent Elements -->
  <circle cx="256" cy="120" r="5" fill="#fef08a" opacity="0.95"/>
  <circle cx="210" cy="390" r="5" fill="#ea580c" opacity="0.95"/>
  <circle cx="302" cy="390" r="5" fill="#ea580c" opacity="0.95"/>
</svg>
